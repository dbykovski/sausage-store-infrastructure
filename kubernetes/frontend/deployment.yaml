---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  containers:
    - image: gitlab.praktikum-services.ru:5050/std-ext-019-01/sausage-store/sausage-frontend:latest
      name: frontend
      imagePullPolicy: IfNotPresent
      env:
        - name: BACKEND_URL
          value: "http://localhost/api"
      ports:
        - name: frontend
          containerPort: 80
      volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
            items:
              - key: nginx.conf
                path: nginx.conf
      imagePullSecrets:
        - name: docker-config-secret