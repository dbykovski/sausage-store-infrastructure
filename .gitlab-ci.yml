stages:
  - deploy

deploy-kuber:
  stage: deploy
  image: bitnami/kubectl:1.24.3
  when: manual
  environment:
    name: dev
    url: https://$SAUSAGE_STORE_URL
  before_script:
    - set -euo pipefail
    - mkdir -p $HOME/.kube
    - printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
  script:
    - cd kubernetes
    - export VERSION="1.0.${CI_PIPELINE_ID}"
    - |
      kubectl create secret generic app-secrets \
        --from-literal=spring-datasource-password="$SPRING_DATASOURCE_PASSWORD" \
        --from-literal=spring-datasource-username="$SPRING_DATASOURCE_USERNAME" \
        --from-literal=spring-datasource-url="$SPRING_DATASOURCE_URL" \
        --from-literal=spring-data-mongodb-uri="$SPRING_DATA_MONGODB_URI" \
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f secrets.yaml
    - kubectl apply -f backend -f backend-report -f frontend
    - |
      for d in frontend backend backend-report; do
        echo "Patching $d with app.kubernetes.io/version=${VERSION}"
        kubectl patch deployment "$d" --type merge -p "{
          \"spec\": {\"template\": {\"metadata\": {\"labels\": {\"app.kubernetes.io/version\": \"${VERSION}\"}}}}
        }"
        kubectl set env deployment/"$d" APP_VERSION="$VERSION"
  after_script:
    - rm $HOME/.kube/config