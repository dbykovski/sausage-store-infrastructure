stages:
  - release
  - deploy

variables:
  VERSION: 0.1.${CI_PIPELINE_ID}

upload-helm:
  stage: release
  image: lwolf/helm-kubectl-docker:v1.21.1-v3.6.0
  before_script:
    - mkdir -p $HOME/.kube
    - echo -n $KUBE_CONFIG | base64 -d > $HOME/.kube/config
    - chmod 600 $HOME/.kube/config
    - apk --no-cache add git curl ca-certificates
    - helm plugin install https://github.com/chartmuseum/helm-push.git
    - >
      helm repo add my-nexus "$NEXUS_REPO_HELM_URL" \
      --username "$NEXUS_REPO_USER" \
      --password "$(echo "$NEXUS_REPO_PASS" | base64 -d)"
    - helm repo update
  script:
    - cd sausage-store-chart
    - helm package --version $VERSION ./
    - helm cm-push ./sausage-store-<VERSION>.tgz my-nexus
  after_script:
    - rm $HOME/.kube/config

.deploy-helm:
  stage: deploy
  image: lwolf/helm-kubectl-docker:v1.21.1-v3.6.0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: on_success
  environment:
    name: dev-helm
    url: https://$SAUSAGE_STORE_URL
  before_script:
    - mkdir -p $HOME/.kube
    - echo -n $KUBE_CONFIG | base64 -d > $HOME/.kube/config
  script:
    - helm repo add nexus $NEXUS_REPO_HELM_URL --username ${NEXUS_REPO_USER} --password $(echo $NEXUS_REPO_PASS | base64 -d)
    - helm repo update
    - >
      helm upgrade --install sausage-store \
        --set environment=test \
        --set frontend.fqdn=${SAUSAGE_STORE_URL} \
        --set secrets.postgres_datasource=${SPRING_DATASOURCE_URL}\
        --set secrets.dockerConfigJson=${DOCKER_CONFIG_JSON} \
        --atomic --timeout 15m \
          nexus/sausage-store
  after_script:
    - rm $HOME/.kube/config