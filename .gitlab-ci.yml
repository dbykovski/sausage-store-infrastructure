stages:
  - deploy

deploy-kuber:
  stage: deploy
  image: bitnami/kubectl:1.24.3
  when: manual
  environment:
    name: dev
    url: https://$SAUSAGE_STORE_URL
  before_script:
    - set -euo pipefail
    - mkdir -p $HOME/.kube
    - printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
    - install_packages gettext-base || (apt-get update && apt-get install -y gettext-base && rm -rf /var/lib/apt/lists/*)
  script:
    - cd kubernetes
    - |
      kubectl create secret generic app-secrets \
        --from-literal=spring-datasource-password="$SPRING_DATASOURCE_PASSWORD" \
        --from-literal=spring-datasource-username="$SPRING_DATASOURCE_USERNAME" \
        --from-literal=spring-datasource-url="$SPRING_DATASOURCE_URL" \
        --from-literal=spring-data-mongodb-uri="$SPRING_DATA_MONGODB_URI" \
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f secrets.yaml
    - |
      for f in backend/*.yaml backend-report/*.yaml frontend/*.yaml; do
        echo "Applying $f with VERSION=${VERSION}"
        envsubst '${VERSION}' < "$f" | kubectl apply -f -
      done
  after_script:
    - rm $HOME/.kube/config