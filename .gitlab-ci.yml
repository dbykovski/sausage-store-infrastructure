stages:
  - deploy

variables:
  KUBE_NAMESPACE: "sausage-store"

deploy-kuber:
  stage: deploy
  image: bitnami/kubectl:1.24.3
  when: manual
  environment:
    name: dev
    url: https://$SAUSAGE_STORE_URL
  before_script:
    - set -euo pipefail
    - mkdir -p $HOME/.kube
    - echo -n $KUBE_CONFIG | base64 -d > $HOME/.kube/config
  script:
    - cd kubernetes
    - kubectl apply -f namespace.yaml
    - |
      kubectl create secret generic app-secrets \
        --from-literal=spring-datasource-password="$SPRING_DATASOURCE_PASSWORD" \
        --from-literal=spring-datasource-username="$SPRING_DATASOURCE_USERNAME" \
        --from-literal=spring-datasource-url="$SPRING_DATASOURCE_URL" \
        --from-literal=spring-data-mongodb-uri="$SPRING_DATA_MONGODB_URI" \
        --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -n $KUBE_NAMESPACE -f secrets.yaml
    - kubectl apply -n $KUBE_NAMESPACE -f backend -f backend-report -f frontend
    - kubectl rollout status deploy/backend -n $KUBE_NAMESPACE --timeout=120s || (kubectl describe deploy/backend; kubectl get pods -l app=backend; exit 1)
    - kubectl rollout status deploy/frontend -n $KUBE_NAMESPACE --timeout=120s || (kubectl describe deploy/frontend; kubectl get pods -l app=frontend; exit 1)
    - kubectl rollout status deploy/backend-report -n $KUBE_NAMESPACE --timeout=120s || (kubectl describe deploy/backend-report; kubectl get pods -l app=backend-report; exit 1)
  after_script:
    - rm $HOME/.kube/config