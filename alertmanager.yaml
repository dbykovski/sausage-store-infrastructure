global:
  resolve_timeout: 1m

route:
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m
  receiver: "telegram"
  routes:
    - receiver: "telegram"
      group_wait: 10s
      match_re:
        severity: critical|warning
      continue: true

receivers:
  - name: "telegram"
    telegram_configs:
    - send_resolved: true
      bot_token: {{ .Values.telegram_bot_token | quote }}
      chat_id: {{ .Values.telegram_chat_id | atoi }}
      message: |-
        {{ "{{ range .Alerts }}" }}
        🚨 <b>{{ "{{ .Labels.alertname }}" }}</b> — {{ "{{ .Annotations.summary }}" }}
        {{ "{{ if .Annotations.description }}" }}
        <pre>{{ "{{ .Annotations.description }}" }}</pre>
        {{ "{{ end }}" }}
        {{ "{{ end }}" }}
      parse_mode: HTML