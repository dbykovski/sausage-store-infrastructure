---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-helm
  labels:
    {{- include "sausage-store.labels" . | nindent 4 }}
stringData:
  postgres_datasource: {{ required "set .Values.secrets.postgres_datasource" .Values.secrets.postgres_datasource | quote }}
type: Opaque

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-config-secret-helm
  labels:
    {{- include "sausage-store.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ required "set .Values.secrets.dockerConfigJsonB64" .Values.secrets.dockerConfigJsonB64 | quote }}