---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-helm
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "sausage-store.labels" . | nindent 4 }}
stringData:
  postgres_datasource: {{ required "set .Values.secrets.postgres_datasource" .Values.secrets.postgres_datasource | quote }}
type: Opaque

---
apiVersion: v1
kind: Secret
metadata:
  name: docker-config-secret-helm
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "sausage-store.labels" . | nindent 4 }}
stringData:
  .dockerconfigjson: {{ required "set .Values.secrets.dockerConfigJson" .Values.secrets.dockerConfigJson | quote }}
type: kubernetes.io/dockerconfigjson
