apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Chart.Name }}-{{ .Release.Name }}"
  labels:
    {{- include "sausage-store.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 20%
  selector:
    matchLabels:
      app: "{{ .Values.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.name }}"
    spec:
      containers:
        - image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          name: "{{ .Values.name }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "200m" | quote }}
              memory: {{ .Values.resources.requests.memory | default "200Mi" | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "300m" | quote }}
              memory: {{ .Values.resources.limits.memory | default "512Mi" | quote }}
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-helm
                  key: postgres_datasource
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-helm
                  key: mongodb_datasource
            - name: BACKEND_PORT
              value: "{{ .Values.global.backendPort }}"
            - name: SPRING_FLYWAY_BASELINE
              value: "{{ .Values.global.springFlywayBaseline }}"
          ports:
            - name: backend
              containerPort: {{ .Values.global.backendPort | int }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.global.backendPort | int }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 6
      imagePullSecrets:
        - name: docker-config-secret-helm